[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autogenos"
version = "0.1.0"
description = "Autonomous Multi-Agent Operating System Framework with Recursive Self-Improvement"
authors = [{ name = "Meet Shah", email = "meet@autogenos.org" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "typing-extensions>=4.10.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "GitPython>=3.1.40",
    "pyyaml>=6.0.1",
    "pillow>=10.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[project.urls]
Homepage = "https://meet6338-x.github.io/AutogenOS/"
Documentation = "https://meet6338-x.github.io/AutogenOS/"
Repository = "https://github.com/Meet6338-X/AutogenOS"
Issues = "https://github.com/Meet6338-X/AutogenOS/issues"

[project.optional-dependencies]
windows = [
    "pywin32>=306",
    "comtypes>=1.4.0",
    "pywinauto>=0.6.8",
]
voice = [
    "livekit-agents>=0.8.0",
    "livekit-plugins-silero>=0.6.0",
    "onnxruntime>=1.17.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["autogenos*"]

[project.scripts]
autogenos = "autogenos.cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
